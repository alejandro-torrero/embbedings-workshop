[project]
name = "embeddings-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alejandro Torrero", email = "alejandro@lostorrero.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
embeddings-workshop = "embeddings_workshop.main:main"
ingest = "embeddings_workshop.ingestion.ingestion:ingestion"
query = "embeddings_workshop.db.chroma_query:query_db"


[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "embedding",
]
